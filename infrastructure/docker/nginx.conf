server {
  listen 80;
  root /usr/share/nginx/html;
  access_log off;
  location / {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    # Overriding `types` replaces the default map entirely, so every type the
    # icon stage can produce has to be listed. SVG was missing, and a browser
    # will not render octet-stream in an <img> — GitHub's and Linear's marks
    # are SVG, so a third of the curated set would have shown as monograms.
    types {
      application/gzip  gz;
      application/json  json;
      image/png         png;
      image/jpeg        jpg jpeg;
      image/webp        webp;
      image/svg+xml     svg;
      image/x-icon      ico;
    }
  }
}
